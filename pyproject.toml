[project]
name = "sectionlab"
version = "0.3.0"
description = "Desktop tool for cross-section geometric properties"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "shapely>=2.0",
    "sectionproperties>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
sectionlab = "sectionlab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sectionlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
